<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MittRum - Rumsinspiration</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-background flex flex-col min-h-screen text-dark-text">

    <!-- HEADER -->
    <header class="bg-background shadow-sm border-b border-light sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-6 py-5">
            <div class="flex items-center justify-between">
                <a href="index.html" class="logo text-3xl font-semibold tracking-tight">
                    MittRum
                </a>
                
                <button id="menuToggle" class="text-3xl text-primary hover:text-accent transition-colors focus:outline-none">
                    ☰
                </button>

                <ul id="navMenu" class="nav-menu items-center gap-8 text-base font-medium">
                    <li><a href="index.html" class="nav-link">Hem</a></li>
                    <li><a href="explore.html" class="nav-link">Utforska rum</a></li>
                    <li><a href="create.html" class="nav-link">+ Posta rum</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-1 max-w-7xl mx-auto px-6 py-12">
        
        <!-- Back button -->
        <button onclick="goBack()" 
                class="group flex items-center gap-2 text-primary hover:text-primary-dark transition-colors mb-6">
            <span class="text-2xl group-hover:-translate-x-1 transition-transform">←</span>
            <span class="font-medium text-lg">Tillbaka</span>
        </button>

        <div id="roomContent">
            <p class="text-center text-secondary-text py-20">Laddar rum...</p>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="mt-auto bg-card py-10 text-center text-secondary-text border-t border-[#e8e3d8]">
        <p>&copy; MittRum VT26 - Ett projekt i responsiv webbdesign</p>
    </footer>

    <!-- Scripts -->
    <script src="../js/script.js"></script>
    <script src="../js/data.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const id = parseInt(params.get('id'));
            
            const contentDiv = document.getElementById('roomContent');

            if (!id) {
                contentDiv.innerHTML = `<h1 class="text-3xl font-semibold text-center py-20">Inget rum-ID angivet</h1>`;
                return;
            }

            const room = rooms.find(r => r.id === id);

            if (room) {
                contentDiv.innerHTML = `
                    <h1 class="hero-title text-dark-text">${room.title}</h1>
                    
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
                        <div>
                            <img src="${room.image}" alt="${room.title}" 
                                 class="w-full rounded-2xl shadow-md">
                        </div>
                        
                        <div>
                            <p class="text-secondary-text text-lg leading-relaxed mb-8">
                                ${room.description}
                            </p>
                            
                            <div class="flex flex-wrap gap-4">
                                <span class="bg-card px-5 py-3 rounded-2xl text-sm">💬 ${room.comments} kommentarer</span>
                                
                                ${room.likes > 0 ? 
                                    `<span class="bg-card px-5 py-3 rounded-2xl text-sm">
                                        <span style="color: var(--color-accent)">❤</span> 
                                        ${room.likes} gillar
                                    </span>` 
                                    : ''}
                            </div>
                        </div>
                    </div>
                `;
            } else {
                contentDiv.innerHTML = `<h1 class="text-3xl font-semibold text-center py-20">Rummet kunde inte hittas 😔</h1>`;
            }
        });

        // Back function
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = "explore.html";
            }
        }
    </script>

    <script>
        tailwind.config = { important: true }
    </script>
</body>
</html>
